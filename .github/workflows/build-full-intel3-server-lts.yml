name: Build Full Payload - Intel Server LTS

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run the build
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - self-hosted

concurrency:
  group: lyd-ark-full-payload-server
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build complete intel3-server-lts payload
    uses: ./.github/workflows/build-single-final-payload.yml
    with:
      variant: intel3-server-lts
      runner: ${{ inputs.runner }}
