name: Build Full Payload - NVIDIA 580 Standard Desktop

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run the build
        type: choice
        required: true
        default: github-hosted
        options:
          - github-hosted
          - self-hosted

concurrency:
  group: lyd-ark-image-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build complete ark-nvidia-580 payload
    uses: ./.github/workflows/build-single-final-payload.yml
    with:
      variant: ark-nvidia-580
      runner: ${{ inputs.runner }}
