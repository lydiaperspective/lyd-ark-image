# Rootless container storage lives on the dedicated /orundum btrfs subvolume.
# New accounts use private storage under /orundum/users/<uid>/containers.
# Keep the legacy shared directory for existing installs; never import or delete
# its contents automatically because ownership of its database is ambiguous.
d /orundum            0755 root root -
d /orundum/containers 1777 root root -
